<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Untitled</title>
    

  </head>
    
  <body>
  <title>ماذا نفعل بعد الاستيقاظ من النوم؟</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  :root{
    --purple:#6c5ce7;
    --green:#4caf50;
    --red:#ff7675;
    --ink:#3a3a4a;
    --sub:#7c7c92;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    min-height:100vh;
    background:linear-gradient(135deg,#fef6e4 0%,#e8f4fd 100%);
    font-family:"Tahoma","Segoe UI",Arial,sans-serif;
    direction:rtl;
    color:var(--ink);
    display:flex;
    justify-content:center;
  }
  .app{
    width:100%;
    max-width:500px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding:16px 16px 24px;
    position:relative;
  }
  .sound-toggle{
    position:fixed;
    top:12px;
    left:12px;
    width:40px;height:40px;
    border-radius:50%;
    border:none;
    background:#fff;
    box-shadow:0 4px 12px rgba(0,0,0,.15);
    font-size:18px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    z-index:50;
    transition:transform .15s ease;
  }
  .sound-toggle:active{transform:scale(0.9);}

  header{
    text-align:center;
    padding-top:8px;
    margin-bottom:10px;
  }
  header h1{font-size:20px;margin:0 0 4px;font-weight:800;color:var(--ink);}
  header p{font-size:13px;margin:0;color:var(--sub);}
  /* أثناء اللعب يختفي العنوان حتى يكون السهم والنقاط في أعلى الصفحة */
  .app.playing header{display:none;}

  .screen{display:none;flex:1;flex-direction:column;}
  .screen.active{display:flex;}

  /* ---------- levels screen ---------- */
  .level-list{display:flex;flex-direction:column;gap:14px;margin-top:8px;}
  .level-card{
    background:#fff;
    border-radius:18px;
    box-shadow:0 6px 18px rgba(0,0,0,.12);
    padding:18px 16px;
    display:flex;
    align-items:center;
    gap:14px;
    cursor:pointer;
    border:5px solid transparent;
    transition:transform .15s ease,border-color .2s ease;
  }
  .level-card:active{transform:scale(0.98);}
  .level-card .icon{
    font-size:34px;
    width:56px;height:56px;
    display:flex;align-items:center;justify-content:center;
    background:#f4f1ff;
    border-radius:16px;
    flex-shrink:0;
  }
  .level-card .txt{flex:1;text-align:right;}
  .level-card .txt h3{margin:0 0 4px;font-size:16px;font-weight:800;}
  .level-card .txt p{margin:0;font-size:13px;color:var(--sub);}
  .level-card .dots-mini{display:flex;gap:4px;margin-top:8px;}
  .level-card .dots-mini span{width:7px;height:7px;border-radius:50%;background:#e6e6ee;}
  .level-card .dots-mini span.done{background:var(--green);}

  /* ---------- game screen ---------- */
  /* السهم والنقاط بجانب بعض في أعلى الصفحة */
  .game-top{
    display:flex;
    align-items:center;
    justify-content:flex-start;
    gap:14px;
    margin-bottom:12px;
    padding-left:48px; /* مساحة لزر الصوت */
  }
  .back-btn{
    border:none;background:#fff;border-radius:50%;
    width:36px;height:36px;box-shadow:0 3px 8px rgba(0,0,0,.1);
    font-size:16px;cursor:pointer;flex-shrink:0;
  }
  .progress{display:flex;gap:8px;}
  .progress span{
    width:12px;height:12px;border-radius:50%;
    background:#e6e6ee;
    transition:transform .2s ease,background .2s ease;
  }
  .progress span.current{background:var(--purple);box-shadow:0 0 0 4px rgba(108,92,231,.25);}
  .progress span.done{background:var(--green);transform:scale(1.15);}

  .prompt-box{
    background:#fff;
    border-radius:16px;
    box-shadow:0 4px 14px rgba(0,0,0,.08);
    padding:14px 14px;
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:16px;
  }
  .prompt-box p{flex:1;margin:0;font-size:19px;font-weight:700;line-height:1.5;text-align:right;}
  .speak-btn{
    width:38px;height:38px;
    border-radius:50%;
    border:none;
    background:var(--purple);
    color:#fff;
    font-size:16px;
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:transform .15s ease;
  }
  .speak-btn:active{transform:scale(0.92);}
  .speak-btn.speaking{animation:pulse .6s infinite alternate;}
  @keyframes pulse{
    from{box-shadow:0 0 0 0 rgba(108,92,231,.5);}
    to{box-shadow:0 0 0 10px rgba(108,92,231,0);}
  }

  .cards-wrap{display:flex;flex-direction:column;gap:12px;}
  .card{
    position:relative;
    background:#fff;
    border-radius:18px;
    box-shadow:0 6px 18px rgba(0,0,0,.12);
    border:5px solid transparent;
    overflow:hidden;
    cursor:pointer;
    transition:transform .15s ease,border-color .2s ease;
  }
  .card:active{transform:scale(0.98);}
  .card.locked{cursor:default;}
  .card img{
    display:block;
    width:100%;
    aspect-ratio:3/2;
    object-fit:cover;
    image-rendering:auto;
    -webkit-user-drag:none;
    user-select:none;
  }
  .card.correct{border-color:var(--green);}
  .card.wrong-flash{border-color:var(--red);animation:shake .4s ease;}
  @keyframes shake{
    0%{transform:translateX(0);}
    20%{transform:translateX(-8px);}
    40%{transform:translateX(8px);}
    60%{transform:translateX(-6px);}
    80%{transform:translateX(6px);}
    100%{transform:translateX(0);}
  }
  .badge{
    position:absolute;
    top:8px;left:8px;
    width:38px;height:38px;
    border-radius:50%;
    background:var(--green);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:20px;
    font-weight:900;
    opacity:0;
    transform:scale(0.4);
    transition:opacity .3s ease,transform .3s ease;
  }
  .badge.show{opacity:1;transform:scale(1);}
  .xmark{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.28);
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease;
  }
  .xmark.show{opacity:1;}
  .xmark span{font-size:64px;line-height:1;text-shadow:0 2px 6px rgba(0,0,0,.4);}

  .game-area{transition:opacity .25s ease;}
  .game-area.fading{opacity:0;}

  /* المستوى الثاني (٣ صور): نفس حجم صور النشاط المرجعي */
  #gameArea.lvl-2 .prompt-box{padding:10px 14px;margin-bottom:10px;}
  #gameArea.lvl-2 .prompt-box p{font-size:17px;}
  #gameArea.lvl-2 .cards-wrap{gap:8px;}
  #gameArea.lvl-2 .card img{aspect-ratio:16/9;}

  /* ---------- summary screen ---------- */
  .summary-card{
    background:#fff;
    border-radius:20px;
    box-shadow:0 8px 24px rgba(0,0,0,.14);
    padding:28px 20px;
    text-align:center;
    margin-top:12px;
  }
  .summary-card h2{font-size:24px;margin:0 0 6px;}
  .summary-card .score{font-size:34px;font-weight:900;color:var(--purple);margin:10px 0;}
  .stars{font-size:30px;letter-spacing:4px;margin-bottom:14px;}
  .summary-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px;}
  .summary-actions button{
    border:none;
    padding:11px 18px;
    border-radius:28px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
    transition:transform .15s ease;
  }
  .summary-actions button:active{transform:scale(0.94);}
  .btn-primary{background:var(--purple);color:#fff;}
  .btn-secondary{background:#f0f0f6;color:var(--ink);}
</style>

<div class="app" id="app">
  <button class="sound-toggle" id="soundToggle" aria-label="الصوت">🔊</button>

  <header>
    <h1>ماذا نفعل بعد الاستيقاظ؟</h1>
    <p>لعبة اختيار السلوك الصحيح</p>
  </header>

  <!-- LEVELS SCREEN -->
  <section class="screen active" id="screen-levels">
    <div class="level-list">
      <div class="level-card" data-level="1">
        <div class="icon">🛏️</div>
        <div class="txt">
          <h3>المستوى الأول</h3>
          <p>اختر بين صورتين</p>
          <div class="dots-mini" id="miniDots1"></div>
        </div>
      </div>
      <div class="level-card" data-level="2">
        <div class="icon">🎯</div>
        <div class="txt">
          <h3>المستوى الثاني</h3>
          <p>اختر بين ثلاث صور</p>
          <div class="dots-mini" id="miniDots2"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- GAME SCREEN -->
  <section class="screen" id="screen-game">
    <div class="game-top">
      <button class="back-btn" id="backBtn" aria-label="رجوع">➡</button>
      <div class="progress" id="progressDots"></div>
    </div>

    <div class="game-area" id="gameArea">
      <div class="prompt-box">
        <button class="speak-btn" id="speakBtn" aria-label="اسمع السؤال">🔊</button>
        <p id="questionText">مَاذَا نَفْعَلُ بَعْدَ الاِسْتِيقَاظِ مِنَ النَّوْمِ؟</p>
      </div>
      <div class="cards-wrap" id="cardsWrap"></div>
    </div>
  </section>

  <!-- SUMMARY SCREEN -->
  <section class="screen" id="screen-summary">
    <div class="summary-card">
      <h2>أحسنت! 🎉</h2>
      <div class="score" id="summaryScore">5 / 5</div>
      <div class="stars" id="summaryStars">⭐⭐⭐</div>
      <div class="summary-actions">
        <button class="btn-secondary" id="restartLevelBtn">إعادة المستوى</button>
        <button class="btn-primary" id="nextActionBtn">المستوى التالي</button>
      </div>
    </div>
  </section>
</div>

  var LEVELS = {
    1: [ {src:IMG.bed, correct:true,  alt:"طفلة ترتب سريرها"},
         {src:IMG.messy, correct:false, alt:"طفلة تترك السرير غير مرتب"} ],
    2: [ {src:IMG.bed, correct:true,  alt:"طفلة ترتب سريرها"},
         {src:IMG.leaving, correct:false, alt:"طفلة تخرج وتترك الغرفة فوضى"},
         {src:IMG.jumping, correct:false, alt:"طفلة تقفز على السرير"} ]
  };

  var ROUNDS = 5;          // خمس تكرارات في كل مستوى
  var X_TIME = 2000;       // مدة ظهور ❌ (ثانيتان)
  var NEXT_DELAY = 900;    // الانتظار بعد انتهاء "ممتاز" قبل التكرار التالي
  var FADE = 250;          // مدة الانتقال بين التكرارات
  var Q_DELAY = 350;       // تشغيل السؤال بعد ظهور الصور

  var app = document.getElementById("app");
  var screens = {
    levels: document.getElementById("screen-levels"),
    game: document.getElementById("screen-game"),
    summary: document.getElementById("screen-summary")
  };
  var gameArea = document.getElementById("gameArea");
  var cardsWrap = document.getElementById("cardsWrap");
  var progressDots = document.getElementById("progressDots");
  var speakBtn = document.getElementById("speakBtn");
  var soundToggle = document.getElementById("soundToggle");

  var aQ = document.getElementById("audioQuestion");
  var aOK = document.getElementById("audioCorrect");
  var aNO = document.getElementById("audioWrong");
  var ALL_AUDIO = [aQ, aOK, aNO];
  ALL_AUDIO.forEach(function(a){ a.volume = 1; a.muted = false; });

  var soundOn = true;
  var unlocked = false;
  var level = 1, round = 0, firstTry = 0, missedThisRound = false;
  var locked = false;
  var lastOrder = "";
  var timers = [];
  var progress = {1:0, 2:0};

  /* ---------- timers ---------- */
  function later(fn, ms){ var t = setTimeout(fn, ms); timers.push(t); return t; }
  function clearTimers(){ timers.forEach(clearTimeout); timers = []; }

  /* ---------- audio ---------- */
  function unlockAudio(){
    if (unlocked) return;
    unlocked = true;
    ALL_AUDIO.forEach(function(a){
      try{
        a.muted = true;
        var p = a.play();
        if (p && p.then){ p.then(function(){ a.pause(); a.currentTime = 0; a.muted = false; })
                         .catch(function(){ a.muted = false; }); }
        else { a.pause(); a.currentTime = 0; a.muted = false; }
      }catch(e){ a.muted = false; }
    });
  }
  function stopAll(){
    ALL_AUDIO.forEach(function(a){ a.onended = null; try{ a.pause(); a.currentTime = 0; }catch(e){} });
    speakBtn.classList.remove("speaking");
  }
  function play(a, onEnd){
    stopAll();
    if (!soundOn){ if (onEnd) later(onEnd, 600); return; }
    a.muted = false;
    a.volume = 1;
    if (a === aQ) speakBtn.classList.add("speaking");
    var done = false;
    function finish(){
      if (done) return; done = true;
      if (a === aQ) speakBtn.classList.remove("speaking");
      if (onEnd) onEnd();
    }
    a.onended = finish;
    try{
      a.currentTime = 0;
      var p = a.play();
      if (p && p.catch) p.catch(function(){ finish(); });
    }catch(e){ finish(); }
  }

  /* ---------- helpers ---------- */
  function showScreen(name){
    Object.keys(screens).forEach(function(k){ screens[k].classList.toggle("active", k === name); });
    app.classList.toggle("playing", name === "game");
    window.scrollTo(0,0);
  }
  function shuffle(list){
    var a = list.slice();
    for (var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  // ترتيب مختلف عن التكرار السابق في كل مرة
  function newOrder(list){
    var order, key, tries = 0;
    do {
      order = shuffle(list);
      key = order.map(function(o){ return o.src.length + o.alt; }).join("|");
      tries++;
    } while (key === lastOrder && tries < 20);
    lastOrder = key;
    return order;
  }

  function renderProgress(){
    progressDots.innerHTML = "";
    for (var i = 0; i < ROUNDS; i++){
      var s = document.createElement("span");
      if (i < round) s.className = "done";
      else if (i === round) s.className = "current";
      progressDots.appendChild(s);
    }
  }
  function renderMini(){
    [1,2].forEach(function(l){
      var box = document.getElementById("miniDots" + l);
      box.innerHTML = "";
      for (var i = 0; i < ROUNDS; i++){
        var s = document.createElement("span");
        if (i < progress[l]) s.className = "done";
        box.appendChild(s);
      }
    });
  }

  /* ---------- game ---------- */
  function startLevel(l){
    clearTimers(); stopAll();
    level = l; round = 0; firstTry = 0; lastOrder = "";
    gameArea.classList.toggle("lvl-2", l === 2);
    showScreen("game");
    buildRound();
  }

  function buildRound(){
    locked = false;
    missedThisRound = false;
    renderProgress();
    cardsWrap.innerHTML = "";
    newOrder(LEVELS[level]).forEach(function(item){
      var card = document.createElement("div");
      card.className = "card";
      card.innerHTML =
        '<img alt="' + item.alt + '" draggable="false">' +
        '<div class="badge">✓</div>' +
        '<div class="xmark"><span>❌</span></div>';
      card.querySelector("img").src = item.src;
      card.addEventListener("click", function(){ choose(card, item.correct); });
      cardsWrap.appendChild(card);
    });
    gameArea.classList.remove("fading");
    later(function(){ play(aQ); }, Q_DELAY);
  }

  function choose(card, isCorrect){
    if (locked) return;
    if (isCorrect){
      locked = true;
      clearTimers();
      if (!missedThisRound) firstTry++;
      Array.prototype.forEach.call(cardsWrap.children, function(c){
        c.classList.add("locked");
        c.classList.remove("wrong-flash");
        c.querySelector(".xmark").classList.remove("show");
      });
      card.classList.add("correct");
      card.querySelector(".badge").classList.add("show");
      // ننتظر انتهاء "ممتاز" ثم ننتقل حتى لا تتداخل الأصوات
      play(aOK, function(){ later(nextRound, NEXT_DELAY); });
    } else {
      missedThisRound = true;
      var x = card.querySelector(".xmark");
      if (x.classList.contains("show")) return; // ❌ ظاهرة بالفعل على هذه الصورة
      card.classList.remove("wrong-flash");
      void card.offsetWidth;
      card.classList.add("wrong-flash");
      x.classList.add("show");
      play(aNO);
      later(function(){
        x.classList.remove("show");
        card.classList.remove("wrong-flash");
      }, X_TIME);
    }
  }

  function nextRound(){
    round++;
    if (round >= ROUNDS){
      progress[level] = ROUNDS;
      renderMini();
      showSummary();
      return;
    }
    gameArea.classList.add("fading");
    later(buildRound, FADE);
  }

  function showSummary(){
    stopAll();
    document.getElementById("summaryScore").textContent = firstTry + " / " + ROUNDS;
    var stars = firstTry === ROUNDS ? 3 : (firstTry >= 3 ? 2 : 1);
    document.getElementById("summaryStars").textContent = "⭐".repeat(stars);
    document.getElementById("nextActionBtn").textContent = level === 1 ? "المستوى التالي" : "المستويات";
    showScreen("summary");
  }

  function goLevels(){
    clearTimers(); stopAll();
    renderMini();
    showScreen("levels");
  }

  /* ---------- events ---------- */
  Array.prototype.forEach.call(document.querySelectorAll(".level-card"), function(c){
    c.addEventListener("click", function(){
      unlockAudio();
      startLevel(parseInt(c.getAttribute("data-level"), 10));
    });
  });
  document.getElementById("backBtn").addEventListener("click", goLevels);
  speakBtn.addEventListener("click", function(){ unlockAudio(); play(aQ); });
  soundToggle.addEventListener("click", function(){
    soundOn = !soundOn;
    soundToggle.textContent = soundOn ? "🔊" : "🔇";
    if (!soundOn) stopAll();
  });
  document.getElementById("restartLevelBtn").addEventListener("click", function(){ startLevel(level); });
  document.getElementById("nextActionBtn").addEventListener("click", function(){
    if (level === 1) startLevel(2); else goLevels();
  });

  renderMini();
})();
</script>
    
  </body>
  
</html>
